[[language]]
name = "nix"
formatter = { command = "nixfmt" }
auto-format = true

[[language]]
name = "ruby"
auto-format = true

[language-server]
biome = { command = "biome", args = ["lsp-proxy"] }

[[language]]
name = "javascript"
auto-format = true
language-servers = ["biome"]

[[language]]
name = "typescript"
auto-format = true
language-servers = ["biome"]

[language-server.elixir-ls]
command = "elixir-ls"
config = { elixirLS.dialyzerEnabled = true }

[[language]]
name = "elixir"
formatter = { command = "mix format" }
auto-format = true
language-servers = ["elixir-ls"]

[[language]]
name = "heex"
formatter = { command = "mix format" }
auto-format = true
language-servers = ["elixir-ls"]

[[language]]
name = "janet"
formatter = { command = "janet-format" }
auto-format = true

[[language]]
name = "go"
auto-format = true

[language-server.gopls.config]
"formatting.gofumpt" = true

[language-server.tinymist]
command = "tinymist"
config = { exportPdf = "onType", outputPath = "$root/target/$dir/$name", preview.background.enabled = true, preview.background.args = ["--data-plane-host=127.0.0.1:23635", "--invert-colors=never", "--open"] }

[[language]]
name = "typst"
language-servers = ["tinymist"]
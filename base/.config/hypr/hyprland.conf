general {
  border_size = 3
  gaps_in = 0
  gaps_out = 0
  col.active_border = rgb(3584e4)
  col.inactive_border = rgb(77767b)
  layout = master
  resize_on_border = true
  extend_border_grab_area = 30
}

decoration {
  rounding = 0

  blur {
    enabled = false
  }

  shadow {
    enabled = false
  }
}

animations {
  enabled = false
}

input {
  kb_model = pc105
  kb_layout = gb
  kb_options = caps:escape_shifted_capslock
  repeat_rate = 25
  repeat_delay = 350
  accel_profile = flat
  scroll_method = 2fg
  float_switch_override_focus = 2

  touchpad {
    natural_scroll = true
    tap_button_map = lrm
    clickfinger_behavior = true
    drag_lock = true
    tap-and-drag = true
  }
}

device {
  name = foostan-corne
  kb_layout = us
}

gestures {
  gesture = 3, horizontal, workspace
  gesture = 3, up, fullscreen
  gesture = 3, down, float
  gesture = 4, swipe, move
  workspace_swipe_cancel_ratio = 0.2
  workspace_swipe_direction_lock = false
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  force_default_wallpaper = 0
  focus_on_activate = true
  background_color = 0x1A1B42
  new_window_takes_over_fullscreen = 2
}

binds {
  workspace_back_and_forth = true
  allow_workspace_cycles = true
  workspace_center_on = 1
}

cursor {
  hide_on_key_press = true
}

xwayland {
  force_zero_scaling = true
}

exec = uwsm app -- kanshi
exec-once = hyprlock --immediate-render --no-fade-in || hyprctl dispatch exit
exec-once = uwsm app -- udiskie
exec-once = uwsm app -- elephant
exec-once = uwsm app -- walker --gapplication-service
exec-once = uwsm app -- nm-applet
exec-once = uwsm app -- swayosd-server
exec-once = uwsm app -- 1password --silent
exec-once = uwsm app -- com.todoist.Todoist

bind = ALT, Tab, focuscurrentorlast
bind = SUPER, Q, killactive
bind = SUPER, W, exec, zen-browser
bind = SUPER_SHIFT, W, exec, gnome-weather
bind = SUPER, E, exec, geary
bind = SUPER, R, exec, resources
bind = SUPER_SHIFT, R, exec, hyprctl reload
bind = SUPER, T, exec, com.todoist.Todoist
bind = SUPER_SHIFT, T, exec, gnome-clocks

bind = SUPER, A, exec, amberol
bind = SUPER_SHIFT, A, exec, ghostty --title=float -e ncmpcpp
bind = SUPER, S, exec, walker
bind = SUPER_SHIFT, S, exec, 1password --quick-access
bind = SUPER, D, exec, gnome-maps
bind = SUPER_SHIFT, D, exec, eyedropper
bind = SUPER, F, exec, newsflash
bind = SUPER_SHIFT, F, exec, nautilus
bind = SUPER, G, exec, ghostty

bind = SUPER, X, exec, hyprlock
bind = SUPER, C, exec, gnome-calendar
bind = SUPER_SHIFT, C, exec, gnome-contacts
bind = SUPER, V, exec, pwvucontrol
bind = SUPER_SHIFT, V, exec, mullvad-vpn
bind = SUPER, B, exec, blueman-manager

bind = SUPER, Y, exec, pkill -SIGUSR1 waybar
bind = SUPER, U, submap, resize
bind = SUPER, I, togglefloating
bind = SUPER, I, centerwindow
bind = SUPER, O, fullscreen
bind = SUPER, P, layoutmsg, orientationcycle left top
bind = SUPER_SHIFT, P, layoutmsg, orientationprev

bind = SUPER, H, layoutmsg, mfact -0.02
bind = SUPER_SHIFT, H, layoutmsg, addmaster
bind = SUPER, J, layoutmsg, cyclenext
bind = SUPER_SHIFT, J, layoutmsg, swapnext
bind = SUPER, K, layoutmsg, cycleprev
bind = SUPER_SHIFT, K, layoutmsg, swapprev
